@font-face{font-family:Inter;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;font-style:normal;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}

@font-face{font-family:Inter;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
:root{--g:#1f5a30;--gd:#163f22;--gl:#e8f1ea;--tx:#1d2a26;--mu:#7b8a85;--bd:#e7ecea;--bg:#f5f7f6;--red:#e05252;--or:#f2a516}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dfe6e3;font-family:Inter,system-ui,sans-serif;color:var(--tx);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;height:100%;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);min-height:56px;flex-shrink:0}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1.c{text-align:center;color:var(--g);letter-spacing:.5px;font-size:15px;font-weight:700}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--g);flex-shrink:0}
.ib:active{background:var(--gl)}
.ib svg{width:22px;height:22px}
#main{flex:1;overflow-y:auto;overflow-x:hidden}
.foot{padding:10px 14px 14px;border-top:1px solid var(--bd);flex-shrink:0;background:#fff}
.btn{background:var(--g);color:#fff;font-weight:600;border-radius:12px;padding:13px 16px;width:100%;font-size:15px}
.btn:active{background:var(--gd)}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.r{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.45}
.pill{background:var(--g);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.search{display:flex;align-items:center;gap:8px;padding:10px 14px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;height:40px;background:#fff}
.sbox input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:15px}
.sbox input::-webkit-search-cancel-button{display:none}
.clr{width:26px;height:26px;border-radius:50%;background:#e9eeec;color:#55635e;font-size:12px;flex-shrink:0}
mark{background:#fff1b8;color:inherit;border-radius:3px;padding:0 1px}
.sbox svg{width:16px;height:16px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #cfe0d3;background:#f4f8f5;color:var(--g);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:500}
.chip.on{background:var(--gl);border-color:var(--g);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative}
.row:active{background:#f1f6f3}
.av{width:44px;height:44px;border-radius:8px;background:#eef1f0;color:#8a9893;display:grid;place-items:center;font-weight:600;font-size:16px;flex-shrink:0}
.nm{font-weight:500;font-size:14.5px;line-height:1.3}
.sub{color:var(--mu);font-size:12px;margin-top:2px}
.dim{opacity:.45}
.qbadge{position:absolute;left:10px;top:6px;background:var(--g);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.minus{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--bd);color:var(--red);font-size:18px;font-weight:600;display:grid;place-items:center}
.cartbar{display:flex;align-items:center;gap:10px}
.cartbar .main{flex:1;background:var(--g);color:#fff;border-radius:999px;height:52px;display:flex;align-items:center;padding:0 18px;gap:10px}
.cartbar .main b{font-size:24px}
.cartbar .main .t{flex:1;font-size:12px;line-height:1.2}
.menu .it{display:flex;align-items:center;gap:16px;padding:15px 20px;font-size:14.5px}
.menu .it svg{width:24px;height:24px;color:var(--g);flex-shrink:0}
.menu .it:active{background:var(--gl)}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20}

.prof{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.prof .a{width:46px;height:46px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:18px}
.banner{margin:6px 14px;background:var(--gl);color:var(--gd);border-radius:10px;padding:11px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:10px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .18s ease-out}

.sheet .bd{overflow-y:auto;padding:6px 16px 16px}
.fld{margin-top:12px}

.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;outline:0;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tag{display:inline-block;background:#f0f3f2;color:#6c7a75;font-size:10.5px;border-radius:5px;padding:2px 7px;margin-top:5px}

.amt{text-align:center;font-size:30px;font-weight:600;padding:18px 0 6px}

.chg{display:block;margin:6px auto 0;width:fit-content;font-size:20px;font-weight:700;padding:6px 16px;border-radius:12px}
.chg.ok{background:#e3f4e8;color:#137a35}.chg.bad{background:#fdeaea;color:#c62828}.chg.warn{background:#fff3d6;color:#9a6400}.chg.zero{background:#eef1f0;color:#55635e}
.opts{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px}
.opt{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12.5px;color:#55635e;background:#fff;display:flex;align-items:center;gap:6px}
.opt input{border:0;outline:0;width:46px;background:none}
.opt select{border:0;outline:0;background:none;font-weight:600}
.box{margin:6px 14px;border:0;background:#f1f4f3;border-radius:8px;padding:10px 12px;width:calc(100% - 28px);outline:0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 14px}
.pad button{height:64px;font-size:28px;font-weight:500;border-radius:14px;color:#26332e;background:#f4f7f5}
body.wide .pad{gap:8px}
body.wide .pad button{height:84px;font-size:34px}
.pad button:active{background:#eef3f1}
.pad .auto{grid-row:span 2;height:auto!important;font-size:15px!important;border:1.5px solid var(--g);background:var(--gl);color:var(--gd);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
/* teks panjang menyesuaikan */
body{overflow-wrap:anywhere}
input,textarea,select,.pill,.quick button,.chip,.num,.btn{overflow-wrap:normal}
.quick button{border:1px solid #cfe0d3;color:var(--g);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;font-weight:500}

.rp-hero{margin:8px 14px 2px;border-radius:16px;padding:16px;background:linear-gradient(135deg,#1f5a30,#2e7d43);color:#fff;box-shadow:0 6px 18px rgba(31,90,48,.25)}

.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px;padding:12px 14px 24px}
.rc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;min-width:0}
.rc.wide{grid-column:1/-1}
.pelsug{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 0}
.pelsug button{background:#fff;border:1.5px solid var(--g);color:var(--g);border-radius:22px;padding:8px 14px;font-size:15px;text-align:left;line-height:1.15}

.mms{display:flex;gap:8px;padding:12px 14px 0}

.mmsb svg{width:22px;height:22px;color:var(--mu);flex-shrink:0}
.mmsb input{flex:1;min-width:0;border:0;outline:0;font-size:18px;background:transparent;height:100%}
.mmsb .clr{border:0;background:#eef1ef;border-radius:50%;width:30px;height:30px;font-size:14px;color:var(--mu);flex-shrink:0}

.mmmic{flex-shrink:0;width:56px;height:56px;border-radius:16px;border:2px solid #cfdcd2;background:#fff;font-size:24px}

.mmg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 14px 0}

.mmc{position:relative;text-align:left;background:#fff;border:2px solid #dfe7e1;border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .1s}

.s-Mini{background:#e3f2fd;color:#1565c0}.s-Kecil{background:#e3f5df;color:#2e7d32}.s-Sedang{background:#fff4cc;color:#8a6200}.s-Besar{background:#ffe4d1;color:#c2410c}.s-Jumbo{background:#ffdede;color:#b71c1c}.s-tb{background:#eef1ef;color:var(--g)}.s-new{background:#ffcc33;color:#1d3b26}

.mmadd{display:block;margin:14px 14px 0;width:calc(100% - 28px);border:2px dashed var(--g);background:#fff;color:var(--g);font-weight:700;font-size:15px;border-radius:14px;padding:14px}
.mmempty{text-align:center;color:var(--mu);font-size:15px;padding:18px 10px}
.foot:has(.mmfoot){padding:0}.mmfoot{background:#fff}

const IDB={db:null};let lsWarned=false;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('kasirtoko',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv')}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);setTimeout(()=>res(null),3000)}catch(e){res(null)}})}
function idbGet(k){return new Promise(res=>{try{const q=IDB.db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbPut(k,v){return new Promise(res=>{try{const tx=IDB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false)}catch(e){res(false)}})}
function saveLocal(){if(mode!=='local')return;const json=JSON.stringify(S);let lsOk=true;
  try{localStorage.setItem(LKEY,json)}catch(e){lsOk=false;try{localStorage.removeItem(LKEY)}catch(e2){}}
  if(IDB.db)idbPut('state',json).then(ok=>{if(!ok&&!lsOk)warnStore()});else if(!lsOk)warnStore()}
function warnStore(){if(lsWarned)return;lsWarned=true;toast('⚠ Penyimpanan HP penuh! Segera backup / sambungkan cloud');setTimeout(()=>lsWarned=false,60000)}
async function loadLocalAsync(){IDB.db=await idbOpen();let d=null;
  if(IDB.db){const j=await idbGet('state');if(j)try{d=JSON.parse(j)}catch(e){}}
  if(!d)try{d=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){}

async function initStore(){
  let cl=null;
  try{cl=window.claude}catch(e){}
  if(!cl||!cl.use){mode='loading';if(!(await loadLocalAsync())){seedLocal();}mode='local';saveLocal();render();if(cloudOn())syncNow();return}
  const timer=setTimeout(()=>{if(mode==='loading'){mode='local';if(!loadLocal()){seedLocal()}render();toast('Server gak nyambung, pakai data lokal')}},10000);
  let db=null;try{db=await cl.use('db')}catch(e){}
  if(!db){clearTimeout(timer);if(mode==='loading'){mode='local';if(!loadLocal()){seedLocal();saveLocal()}render()}return}
  DB=db;let got={b:0,t:0,m:0,p:0};
  const ready=()=>{if(got.b&&got.t&&got.m&&got.p&&mode==='loading'){clearTimeout(timer);mode='cloud'}};
  db.collection('token').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id}});S.token=o;render()},()=>{});

async function sbFetch(path,opt={},retry=true){
  const c=CL.cfg;const h={apikey:c.key,'Content-Type':'application/json',...(opt.headers||{})};
  if(c.session&&!opt.noAuth)h.Authorization='Bearer '+c.session.access_token;
  const r=await fetch(c.url.replace(/\/+$/,'')+path,{...opt,headers:h});
  if(r.status===401&&retry&&c.session&&!opt.noAuth){await sbRefresh();return sbFetch(path,opt,false)}
  if(!r.ok){let m='';try{const j=await r.json();m=j.msg||j.message||j.error_description||j.error||''}catch(e){}throw new Error((m||('HTTP '+r.status)))}
  return r;
}
async function sbLogin(url,key,email,password){
  CL.cfg={url:url.trim(),key:key.trim(),email:email.trim(),session:null,cursor:null,synced:false};
  const r=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',noAuth:true,body:JSON.stringify({email:CL.cfg.email,password})});
  const j=await r.json();CL.cfg.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user_id:j.user&&j.user.id};saveCL();
}
async function sbRefresh(){
  const c=CL.cfg;const r=await fetch(c.url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:c.session.refresh_token})});
  if(!r.ok)throw new Error('Sesi cloud habis, login ulang di Pengaturan');
  const j=await r.json();c.session={...c.session,access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000};saveCL();
}
async function pullAll(apply){
  const c=CL.cfg;let cursor=c.cursor;let got=0;
  for(let guard=0;guard<50;guard++){
    const since=cursor?new Date(new Date(cursor).getTime()-5000).toISOString():'1970-01-01T00:00:00Z';
    const r=await sbFetch(`/rest/v1/docs?select=col,id,data,deleted,ts,srv_at&srv_at=gt.${encodeURIComponent(since)}&order=srv_at.asc&limit=500`);
    const rows=await r.json();if(!rows.length)break;
    for(const row of rows){if(apply)applyRemote(row);got++}
    const last=rows[rows.length-1].srv_at;if(last===cursor)break;cursor=last;if(rows.length<500)break;
  }
  c.cursor=cursor;saveCL();return got;
}
function applyRemote(row){
  const key=row.col+'/'+row.id;const pend=CL.outbox[key];if(pend&&pend.ts>row.ts)return;
  if(row.col==='meta'){const cur=S.meta._ts||0;if(!row.deleted&&row.data&&row.ts>=cur){S.meta={...S.meta,...row.data};migrate()}return}
  if(!S[row.col])return;const loc=S[row.col][row.id];if(loc&&(loc._ts||0)>row.ts)return;
  if(row.deleted)delete S[row.col][row.id];else S[row.col][row.id]={...row.data,id:row.id};
}
async function syncNow(manual){
  if(!cloudOn()){if(manual)toast('Cloud belum diatur');return}
  if(!navigator.onLine){CL.online=false;if(manual)toast('Lagi offline, data aman di HP');renderSync();return}
  if(CL.busy)return;CL.busy=true;renderSync();
  try{
    const c=CL.cfg;if(c.session.expires_at<Date.now()+60000)await sbRefresh();
    const items=Object.values(CL.outbox);
    for(let i=0;i<items.length;i+=200){const batch=items.slice(i,i+200);
      await sbFetch('/rest/v1/docs?on_conflict=owner,col,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(batch.map(o=>({owner:c.session.user_id,col:o.col,id:o.id,data:o.data,deleted:!o.data,ts:o.ts})))});
      for(const o of batch){const k=o.col+'/'+o.id;if(CL.outbox[k]&&CL.outbox[k].ts===o.ts)delete CL.outbox[k]}saveOB();
    }
    const n=await pullAll(true);if(n){saveLocal();render()}
    CL.last=Date.now();CL.err=null;CL.online=true;if(manual)toast('Sinkron selesai ✓');
  }catch(e){CL.err=(e&&e.message)||'Gagal sinkron';if(manual)toast('Sinkron gagal: '+CL.err)}
  finally{CL.busy=false;renderSync()}
}

}

function lokRowsSVG(rak,baris){if(rak==='LT')return `<svg viewBox="0 0 200 300"><text x="100" y="140" text-anchor="middle" font-size="70">📦</text><text x="100" y="215" text-anchor="middle" font-size="26" font-weight="800" fill="${RAK_COL.LT}">di lantai</text></svg>`;

async function prodImgPrep(file,mx){const url=URL.createObjectURL(file);try{const img=await loadImg(url);const k=Math.min(1,mx/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}
async function prodImgSet(file){const s=U.sheet;if(!s||s.type!=='barang')return;const b=s.b;s.imgBusy=true;render();
  try{if(cloudOn()){const c=await prodImgPrep(file,700);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
      const name='p-'+b.id+'-'+Math.random().toString(36).slice(2,8)+'.jpg';b.img=await nqUpload(blob,name);toast('Foto tersimpan di cloud ✓')}
    else{const c=await prodImgPrep(file,260);b.img=c.toDataURL('image/jpeg',.72);toast('Foto disimpan di perangkat ini aja (cloud belum nyala)')}}
  catch(e){toast('Gagal upload foto: '+((e&&e.message)||e)+(/bucket|policy|row-level|404|403/i.test(String(e&&e.message))?' — jalankan SQL QR nota dulu (menu Layar Pelanggan)':''))}
  if(U.sheet===s){s.imgBusy=false;render()}}
function barangRowsHTML(list){const sel=U.bsel;return list.map(b=>{const low=isLow(b);return `<div class="row${sel&&sel.has(b.id)?' selr':''}" data-act="${sel?'bselTog':'editBarang'}" data-id="${b.id}">${sel?`<span class="bchk${sel.has(b.id)?' on':''}">✓</span>`:''}${pAv(b)}<div style="flex:1;min-width:0"><div class="nm">${hl(b.nama,U.bq)}</div><div class="sub">${esc(b.kode||'—')}${b.kategori?' • '+esc(b.kategori):''}${lokCode(b)?' • 📍 '+esc(lokLabel(b)):''}</div><span class="tag">Hrg Dasar ${rp(b.dasar)}</span>${isJasa(b)?' <span class="tag gr">Jasa</span>':''}</div><div style="text-align:right"><div style="font-weight:600;color:${low?'var(--red)':'var(--g)'}">${isJasa(b)?'∞':(+b.stok||0)}</div><div class="sub">${rp(b.harga)}</div></div></div>`}).join('')||`<div class="empty">${U.bq?'Barang gak ketemu':'Belum ada barang'}</div>`}
function hl(name,q){const n=String(name||'');const toks=norm(q).split(' ').filter(Boolean);if(!toks.length)return esc(n);const low=n.toLowerCase();const marks=new Array(n.length).fill(false);toks.forEach(t=>{let i=low.indexOf(t);while(i>=0&&t){for(let j=i;j<i+t.length;j++)marks[j]=true;i=low.indexOf(t,i+t.length)}});let o='',on=false;for(let i=0;i<n.length;i++){if(marks[i]&&!on){o+='<mark>';on=true}if(!marks[i]&&on){o+='</mark>';on=false}o+=esc(n[i])}if(on)o+='</mark>';return o}

piutang(){
  const all=Object.values(S.trx).filter(x=>x.piutang&&x.status!=='batal');
  const open=all.filter(x=>sisaOf(x)>0);const done=all.filter(x=>sisaOf(x)<=0);
  const tot=open.reduce((a,x)=>a+sisaOf(x),0);
  const mStart=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();
  const recv=all.reduce((a,x)=>a+(x.cicilan||[]).filter(c=>c.waktu>=mStart).reduce((b,c)=>b+(+c.jumlah||0),0),0);
  const tab=U.piuTab||'open';const q=norm(U.piuQ||'');
  let list=(tab==='open'?open:done).filter(x=>!q||norm(x.pelanggan).includes(q)||String(x.no)===q);
  const groups={};list.forEach(x=>{const k=(x.pelanggan||'Tanpa nama').trim();(groups[k]=groups[k]||[]).push(x)});
  const gk=Object.keys(groups).sort((a,b)=>tab==='open'?groups[b].reduce((s,x)=>s+sisaOf(x),0)-groups[a].reduce((s,x)=>s+sisaOf(x),0):a.localeCompare(b));
  const row=x=>{const paid=paidOf(x),pct=Math.min(100,Math.round(paid/Math.max(1,x.total)*100)),si=sisaOf(x);
    return `<div class="row" data-act="trxDetail" data-id="${x.id}" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="nm">Nota #${x.no} <span class="sub">· ${tgl(x.waktu)}</span></div>
    <div class="sub">Total ${rp(x.total)} · dibayar ${rp(paid)}${(x.cicilan||[]).length?' · '+x.cicilan.length+'x cicil':''}</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
    <div style="text-align:right;margin-left:10px">${si>0?`<div style="font-weight:700;color:var(--red)">${rp(si)}</div><button class="pill" style="margin-top:6px;padding:6px 12px" data-act="cicilOpen" data-id="${x.id}">Bayar</button>`:'<span class="tag gr">LUNAS</span>'}</div></div>`};
  return{top:`<button class="ib" data-act="openDrawer">${I.menu}</button><h1>Piutang</h1>`,
  body:`<div class="stat"><div class="s"><div class="l">Sisa belum lunas</div><div class="v" style="color:var(--red)">${rp(tot)}</div></div><div class="s"><div class="l">Nota belum lunas</div><div class="v">${open.length}</div></div><div class="s"><div class="l">Pelanggan berutang</div><div class="v">${new Set(open.map(x=>(x.pelanggan||'').trim())).size}</div></div><div class="s"><div class="l">Cicilan masuk bulan ini</div><div class="v" style="color:var(--g)">${rp(recv)}</div></div></div>
  <div class="search" style="padding-top:0"><div class="sbox">${I.search}<input id="s_piuq" type="search" placeholder="Cari nama pelanggan / no nota" value="${esc(U.piuQ||'')}" data-piuq="1" autocomplete="off"></div></div>
  <div class="chips">${[['open','Belum lunas ('+open.length+')'],['done','Sudah lunas ('+done.length+')']].map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-act="piuTab" data-v="${k}">${l}</button>`).join('')}</div>
  <div id="piulist">${gk.map(k=>{const g=groups[k];const gs=g.reduce((a,x)=>a+sisaOf(x),0);return `<div class="sec" style="display:flex;justify-content:space-between;text-transform:none;font-size:13px;color:var(--tx)"><span>👤 ${esc(k)} <span class="sub">(${g.length} nota)</span></span><span style="display:flex;align-items:center;gap:8px">${tab==='open'?`<b style="color:var(--red)">${rp(gs)}</b>`:''}<button class="pill" style="padding:5px 10px;background:#25a244" data-act="piuInv" data-ids="${g.map(x=>x.id).join(',')}">📄 Invoice${g.length>1?' gabungan':''}</button></span></div>${g.sort((a,b)=>a.waktu-b.waktu).map(row).join('')}`}).join('')||`<div class="empty">${tab==='open'?'Gak ada piutang 🎉':'Belum ada piutang yang lunas'}</div>`}</div><div style="height:20px"></div>`};
},
laporan(){

   ${q?`<div class="rp-cmp">vs ${esc(pv.label)}: ${rp(q.omzet)}</div>`:''}

   <div><div class="l">Transaksi</div><div class="v">${r.n}</div>${q?`<div class="l">${delta(pct(r.n,q.n))||'&nbsp;'}</div>`:''}</div>
   <div><div class="l">Rata-rata / transaksi</div><div class="v">${rp(r.avg)}</div></div>

  <div style="padding:6px 14px 0"><button class="btn o" data-act="exportXlsx" style="border-color:#1d6f42;color:#1d6f42">⬇ Download Laporan Excel (${esc(P.label)})</button></div>
  <div class="rp-grid">
   <div class="rc wide"><h3>Grafik penjualan <small>${C.unit}</small></h3>${chartSVG(C)}</div>
   <div class="rc"><h3>Laba &amp; rugi</h3>
    ${RL('Penjualan kotor',rp(r.sub))}${RL('Diskon',r.disc?'−'+rp(r.disc):rp(0),{col:r.disc?'var(--red)':''})}${r.tax?RL('Pajak',rp(r.tax)):''}
    ${RL('Omzet bersih',rp(r.omzet),{c:'tot'})}${RL('Modal barang (HPP)',r.modal?'−'+rp(r.modal):rp(0))}${RL('Laba kotor',rp(r.laba),{c:'tot',col:r.laba>=0?'var(--g)':'var(--red)'})}

   <div class="rc wide"><h3>Barang terlaris <span class="seg"><button class="${U.topBy!=='v'?'on':''}" data-act="topBy" data-v="q">Qty</button><button class="${U.topBy==='v'?'on':''}" data-act="topBy" data-v="v">Omzet</button></span></h3>

function parseImportRows(rows){
  const hi=rows.findIndex(r=>r.some(c=>/nama/i.test(String(c)))&&r.some(c=>/harga|jual/i.test(String(c))));if(hi<0)return null;
  const H=rows[hi].map(c=>norm(c));const col=(...ps)=>H.findIndex(h=>ps.some(p=>p.test(h)));
  const C={kode:col(/^kode/,/barcode/,/sku/),nama:col(/^nama/),jual:col(/harga_jual/,/harga jual/,/^harga$/),beli:col(/harga_beli/,/harga beli/,/harga_dasar/,/harga dasar/,/modal/),stok:col(/^stok/),min:col(/minimum/,/min_stok/,/min stok/),jasa:col(/barang_jasa/,/^jasa/),sat:col(/satuan/),rak:col(/rak/),kat:col(/kategori/)};
  if(C.nama<0||C.jual<0)return null;
  const n=v=>typeof v==='number'?v:(parseFloat(String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0);
  const out=[];
  for(const r of rows.slice(hi+1)){
    const nama=String(r[C.nama]??'').trim();const jual=r[C.jual];
    if(!nama||nama.length>120)continue;
    if(typeof jual==='string'&&/[a-z]/i.test(jual))continue;
    let kode=C.kode>=0?r[C.kode]:'';kode=typeof kode==='number'?String(Math.round(kode)):String(kode??'').trim();
    const sat=C.sat>=0?String(r[C.sat]??'').trim():'';
    out.push({nama,kode,harga:n(jual),dasar:C.beli>=0?n(r[C.beli]):0,stok:C.stok>=0?n(r[C.stok]):0,minStok:C.min>=0?n(r[C.min]):0,jasa:C.jasa>=0?String(r[C.jasa]).trim()==='1':false,satuan:sat||'pcs',rak:C.rak>=0?String(r[C.rak]??'').trim():'',kategori:C.kat>=0?String(r[C.kat]??'').trim():''});
  }
  return out;
}

    let items=null;for(const nm of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:''});items=parseImportRows(rows);if(items&&items.length)break}

async function doImport(){

    else{const id=uid();used.add(id);changed.push({id,...it,_ts:now});added++}

}

function strukLines(t){
  const c=cfg(),W=+c.paper===80?48:32,L=[];
  const lr=(l,r,o={})=>{l=asc(l);r=asc(r);if(l.length+r.length+1>W){L.push({t:l,...o});L.push({t:r.padStart(W),...o})}else L.push({t:l+' '.repeat(W-l.length-r.length)+r,...o})};
  for(const x of strukBlocks(t)){
    if(x.k==='solid')L.push({t:'='.repeat(W)});
    else if(x.k==='dash')L.push({t:'-'.repeat(W)});
    else if(x.k==='c')String(x.t).split('\n').forEach(line=>{if(line.trim())wrap(line,W).forEach(z=>L.push({t:z,a:'c',b:x.b}))});
    else if(x.k==='item')wrap(x.t,W).forEach(z=>L.push({t:z,b:1}));
    else if(x.k==='qty')lr('  '+x.l,x.r);
    else if(x.k==='lr')lr(x.l,x.r,{b:x.b});
    else if(x.k==='total')lr(x.l,x.r,{b:1,tall:1});
    else if(x.k==='kv'||x.k==='kvi'){const kw=Math.max(...x.rows.map(r=>asc(r[0]).length));x.rows.forEach(([k,v])=>{const pre=asc(k).padEnd(kw)+' : ';wrap(v,Math.max(8,W-pre.length)).forEach((z,i)=>L.push({t:(i?' '.repeat(pre.length):pre)+z}))})}
    else if(x.k==='art'){L.push({t:''});L.push({t:'Terima Kasih',a:'c',b:1,big:1})}
  }
  return{L,W,c};
}
function strukText(t){const{L,W}=strukLines(t);return L.map(l=>l.a==='c'?' '.repeat(Math.max(0,Math.floor(((l.big?W/2:W)-l.t.length)/2)))+l.t:l.t).join('\n')}

function canvasToRaster(cv){const dots=cv.width,h=cv.height,bw=dots/8;const d=cv.getContext('2d').getImageData(0,0,dots,h).data;const out=new Uint8Array(bw*h);for(let y=0;y<h;y++)for(let xx=0;xx<dots;xx++){if(d[(y*dots+xx)*4]<128)out[y*bw+(xx>>3)]|=(0x80>>(xx&7))}return{bw,h,out}}

  const anim=f.animate([{transform:`translate(${sx}px,${sy}px) scale(1)`,opacity:1},{transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-60}px) scale(1.15)`,opacity:1,offset:.45},{transform:`translate(${ex}px,${ey}px) scale(.4)`,opacity:.3}],{duration:520,easing:'cubic-bezier(.4,0,.2,1)'});
  anim.onfinish=()=>f.remove();
}
